{{define "unsubscribe.html"}}<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>停止接收提醒</title><link rel="stylesheet" href="/static/app.css"></head><body><main class="shell narrow"><section class="panel auth-card"><h1>停止接收提醒？</h1><p>确认后，<strong>{{.Email}}</strong> 将不再收到比赛通知。以后仍可用同一邮箱重新验证并启用。</p><form method="post" action="/unsubscribe"><input type="hidden" name="token" value="{{.UnsubscribeKey}}"><button class="danger" type="submit">确认停止提醒</button></form></section></main></body></html>{{end}}
