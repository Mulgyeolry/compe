name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least-privilege: the pipeline only needs to read the repository contents.
permissions:
  contents: read

# Cancel any in-flight run for the same branch when a newer commit is pushed,
# so only the latest result matters.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Download modules
        run: go mod download
      - name: Verify modules
        run: go mod verify
      - name: Test
        run: go test -count=1 ./...
      - name: Test with race detector
        run: go test -race -count=1 ./...

  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Vet
        run: go vet ./...
      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@2026.1
      - name: Run staticcheck
        run: '"$(go env GOPATH)/bin/staticcheck" ./...'

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
      - name: Run govulncheck
        run: '"$(go env GOPATH)/bin/govulncheck" ./...'

  container:
    name: container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build production image
        run: |
          docker build \
            --build-arg GOLANG_IMAGE=golang:1.25-bookworm \
            --build-arg RUNTIME_IMAGE=debian:bookworm-slim \
            --build-arg GOPROXY=https://proxy.golang.org,direct \
            --tag competition-assistant:ci \
            .

      - name: Verify non-root runtime user
        run: |
          test "$(docker image inspect \
            --format '{{.Config.User}}' \
            competition-assistant:ci)" = "appuser"

      - name: Smoke test production container
        shell: bash
        run: |
          set -euo pipefail

          container_name="competition-assistant-ci"

          cleanup() {
            status=$?
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker logs "$container_name" || true
            fi
            docker rm -f "$container_name" >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          docker run --detach \
            --name "$container_name" \
            --publish 127.0.0.1:18080:8080 \
            --env WEB_LISTEN_ADDR=:8080 \
            --env PUBLIC_BASE_URL=http://127.0.0.1:18080 \
            --env APP_SECRET=0123456789abcdef0123456789abcdef \
            --env 'APPRISE_SENDER_URL=mailtos://sender%40example.com:ci-password@smtp.example.com:465/?from=sender%40example.com&mode=ssl' \
            --volume "$PWD/sources.example.yaml:/app/config/sources.yaml:ro" \
            competition-assistant:ci

          for attempt in $(seq 1 30); do
            if health_body="$(
              curl --fail --silent --show-error \
                http://127.0.0.1:18080/healthz 2>/dev/null
            )"; then
              break
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "production container did not become healthy"
              exit 1
            fi

            sleep 1
          done

          test "$health_body" = "ok"

          ready_body="$(
            curl --fail --silent --show-error \
              http://127.0.0.1:18080/readyz
          )"
          test "$ready_body" = "ready"

          test "$(
            docker inspect \
              --format '{{.State.Running}}' \
              "$container_name"
          )" = "true"
